<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider">
      <img
        id="image"
        src="https://picsum.photos/id/1015/500/300"

    </div>

    <script src="script.js"></script>
  </body>
</html>
